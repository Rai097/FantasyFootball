# Render.com blueprint: deploys the app as one web service straight from GitHub.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fantasy-trade-desk
    runtime: node
    plan: free
    # Yahoo Fantasy Sports is US-only and its API refuses non-US addresses; keep the service in a US region.
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
